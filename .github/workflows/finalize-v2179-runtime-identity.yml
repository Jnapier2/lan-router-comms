name: Finalize v2.17.9 runtime identity

on:
  push:
    branches:
      - agent/v2179-runtime-identity-20260814

permissions:
  contents: write

concurrency:
  group: gateway-lan-link-v2179-identity
  cancel-in-progress: false

jobs:
  finalize-and-verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Patch build identity and generate exact manifest
        shell: powershell
        run: |
          python .\scripts\apply_v2179_runtime_identity.py

      - name: Remove one-use finalization machinery
        shell: powershell
        run: |
          Remove-Item -LiteralPath .\scripts\apply_v2179_runtime_identity.py -Force
          Remove-Item -LiteralPath .\.github\workflows\finalize-v2179-runtime-identity.yml -Force
          if ((Get-ChildItem -LiteralPath .\scripts -Force -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Remove-Item -LiteralPath .\scripts -Force
          }

      - name: Parse source and enforce security invariants
        shell: powershell
        run: .\tests\Test-SafetyContracts.ps1

      - name: Verify canonical launcher contract
        shell: powershell
        run: .\tests\Test-LauncherContract.ps1

      - name: Verify runtime identity and tamper rejection
        shell: powershell
        run: .\tests\Test-RuntimeIdentityContract.ps1

      - name: Launch from an unrelated working directory
        shell: powershell
        run: |
          $caller = Join-Path $env:RUNNER_TEMP 'gateway-lan-link-finalize-cwd'
          New-Item -ItemType Directory -Path $caller -Force | Out-Null
          Push-Location $caller
          try {
            & "$env:GITHUB_WORKSPACE\GatewayLANLink.bat" -Mode StartupTest
            $launchExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($launchExit -ne 0) { throw "Gateway LAN Link startup smoke failed with exit code $launchExit." }
          foreach ($name in @('config','state','logs','temp','exports','diag','inbox')) {
            if (Test-Path -LiteralPath (Join-Path $caller $name)) {
              throw "Gateway LAN Link wrote $name under the caller working directory."
            }
          }

      - name: Commit verified final source
        shell: powershell
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if (git diff --cached --quiet) { throw "The finalization workflow produced no source changes." }
          git commit -m "Align Gateway LAN Link runtime identity with v2.17.9"
          git push origin HEAD:agent/v2179-runtime-identity-20260814

